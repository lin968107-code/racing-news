name: Daily Reviewed Articles (08:00 Beijing)
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reviewed-daily-articles
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Publish approved articles only
        run: python3 scripts/publish_reviewed_daily.py
      - name: Commit approved articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A articles _approved
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed articles: Beijing daily 08:00"
            git push
          else
            echo "Nothing eligible for publication today"
          fi
